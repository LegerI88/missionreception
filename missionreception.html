<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Réception – 1EPC1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --concrete:#E3E5E1; --paper:#FBFBF8; --ink:#1B2A47; --ink-soft:#4A5770;
  --kraft:#B98752; --kraft-lite:#EAD8C0; --safety:#F2C230; --stamp:#B8322A; --ok:#2C7A4B; --line:#C9CCC6;
  --focus:#1F5FD1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --concrete:#1A1F29; --paper:#242B38; --ink:#EEF0F4; --ink-soft:#AEB6C6;
    --kraft:#D3A571; --kraft-lite:#3B3226; --safety:#F2C230; --stamp:#F0776E; --ok:#6BCB93; --line:#3A4252; --focus:#7FAAFF;
  }
}
:root[data-theme="dark"]{
  --concrete:#1A1F29; --paper:#242B38; --ink:#EEF0F4; --ink-soft:#AEB6C6;
  --kraft:#D3A571; --kraft-lite:#3B3226; --safety:#F2C230; --stamp:#F0776E; --ok:#6BCB93; --line:#3A4252; --focus:#7FAAFF;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--concrete);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:1.0625rem;line-height:1.55}
h1,h2,h3{font-family:Archivo,"Arial Narrow",Arial,sans-serif;line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:900;font-stretch:80%;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;font-stretch:85%}
h3{font-size:1.2rem;font-weight:700}
p{margin:0 0 .9em;max-width:70ch}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 60px}

/* bandeau quai de chargement */
.dock{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--paper);}
:root[data-theme="dark"] .dock{background:#0E131C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dock{background:#0E131C;color:#EEF0F4}}
.dock-in{max-width:900px;margin:0 auto;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dock b{font-family:Archivo,Arial,sans-serif;font-stretch:80%;font-size:1.1rem}
.dock .who{opacity:.85;font-size:.95rem}
.dock .score{margin-left:auto;font-family:Archivo,Arial,sans-serif;font-weight:800}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--safety) 0 14px,#1B1B1B 14px 28px)}
.track{display:flex;gap:4px;max-width:900px;margin:0 auto;padding:10px 18px 0}
.track button{flex:1;min-width:0;height:34px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:.9rem;border-radius:3px}
.track button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.track button.here{background:var(--safety);color:#1B1B1B;border-color:#1B1B1B}
.track button:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{padding:34px 0 10px}
.hero .truck{font-size:3.2rem;line-height:1}
.hero p.lead{font-size:1.2rem}

/* sections */
.mission{background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:22px 20px;margin-top:20px}
.mhead{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.mnum{font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:75%;font-size:3rem;color:var(--kraft);line-height:.9}
.time{display:inline-block;background:var(--safety);color:#1B1B1B;font-weight:700;padding:2px 10px;border-radius:2px;font-size:.9rem}
.brief{background:var(--kraft-lite);border-left:6px solid var(--kraft);padding:12px 14px;margin:14px 0}
.brief p:last-child{margin:0}
.tip{font-size:.95rem;color:var(--ink-soft)}

/* QCM */
.q{border-top:1px dashed var(--line);padding:14px 0}
.q:first-child{border-top:0}
.q .qt{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);background:transparent;border-radius:4px;cursor:pointer}
.opt:hover{border-color:var(--ink-soft)}
.opt.sel{border-color:var(--ink);background:var(--kraft-lite)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.wrong{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 14%,transparent)}
.expl{margin-top:8px;padding:8px 12px;border-left:4px solid var(--ok);font-size:.97rem;display:none}
.expl.bad{border-left-color:var(--stamp)}
.show .expl{display:block}

.btn{display:inline-block;padding:12px 20px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:1.05rem;border-radius:4px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.result{font-weight:700}

/* documents style formulaire carbone */
.doc{border:2px solid var(--ink);background:var(--paper);margin:12px 0;border-radius:2px}
.doc .dh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;border-bottom:2px solid var(--ink);font-family:Archivo,Arial,sans-serif;font-weight:800}
.doc.bl .dh{background:#DCE6F5;color:#1B2A47}
.doc.bc .dh{background:#F3E7B8;color:#1B2A47}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.97rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{font-family:Archivo,Arial,sans-serif;font-weight:700;font-size:.9rem}
td.n,th.n{text-align:right}
select,input[type=number],input[type=text],textarea{border:2px solid var(--line);background:var(--paper);border-radius:4px;padding:8px}
select{min-width:10em}
input[type=number]{width:6em}
textarea{width:100%;min-height:130px}
.cellok{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.cellko{background:color-mix(in srgb,var(--stamp) 14%,transparent)}

/* ordre */
.pool,.seq{display:grid;gap:8px;margin:10px 0}
.chip{padding:10px 12px;border:2px dashed var(--kraft);background:var(--kraft-lite);border-radius:4px;cursor:pointer;text-align:left;width:100%}
.seq .chip{border-style:solid;cursor:default}
.seq .chip span{font-family:Archivo,Arial,sans-serif;font-weight:900;margin-right:8px}
.seq-empty{color:var(--ink-soft);font-style:italic}

/* cartes incident */
.incidents{display:grid;gap:14px}
.card{border:2px solid var(--ink);border-radius:4px;padding:14px;position:relative;background:var(--paper)}
.card .choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card .choices button{flex:1 1 150px;padding:10px;border:2px solid var(--line);background:transparent;border-radius:4px;cursor:pointer;font-weight:700}
.card .choices button.sel{border-color:var(--ink);background:var(--kraft-lite)}
.card .choices button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.card .choices button.wrong{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 14%,transparent)}
.stamp{position:absolute;top:10px;right:12px;border:3px solid var(--stamp);color:var(--stamp);font-family:Archivo,Arial,sans-serif;font-weight:900;font-stretch:80%;padding:2px 8px;transform:rotate(-8deg);border-radius:3px;display:none}
.card.show .stamp{display:block;animation:thump .35s ease-out}
@keyframes thump{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.card.show .stamp{animation:none}}

/* bilan */
.bilan table td:last-child{text-align:right;font-weight:700}
.eval-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:8px 0}
.eval-row .lv{display:flex;gap:6px}
.eval-row .lv button{padding:6px 10px;border:2px solid var(--line);background:transparent;border-radius:4px;cursor:pointer;font-size:.9rem}
.eval-row .lv button.sel{border-color:var(--ink);background:var(--safety);color:#1B1B1B}
.teacher{margin-top:28px;background:var(--paper);border:2px dashed var(--ink-soft);border-radius:4px;padding:14px 18px}
.teacher summary{cursor:pointer;font-family:Archivo,Arial,sans-serif;font-weight:800;font-size:1.1rem}
.teacher li{margin-bottom:.4em}
.src a{color:var(--focus);word-break:break-word}
.hidden{display:none}
@media (max-width:560px){.track button{font-size:.8rem;height:30px}.mission{padding:16px 14px}.eval-row{grid-template-columns:1fr}}
@media print{.dock,.track,.stripe,.actions,.teacher,.no-print{display:none!important}body{background:#fff;color:#000}.mission{border:1px solid #000}}
</style>
</head>
<body>
<div class="dock">
  <div class="dock-in">
    <b>🚚 Mission Réception</b><span class="who" id="who"></span>
    <span class="score" id="score">0 pt</span>
  </div>
  <div class="stripe"></div>
</div>
<nav class="track" id="track" aria-label="Étapes de la mission"></nav>

<main class="wrap" id="app"></main>

<script>
(function(){
const KEY='mission-reception-1epc1-v1';
let S={name:'',cur:0,res:{},evals:{}};
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw));}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const MISSIONS=[
 {t:'Prise de poste',d:5},
 {t:'Échauffement',d:10},
 {t:'Les documents',d:15},
 {t:'Contrôle quantitatif',d:25},
 {t:'Contrôle qualitatif',d:20},
 {t:'Rédiger les réserves',d:15},
 {t:'Ranger le stock',d:15},
 {t:'Bilan',d:15}
];
const app=document.getElementById('app');
const track=document.getElementById('track');

function total(){let s=0,m=0;for(const k in S.res){s+=S.res[k].s;m+=S.res[k].m;}return {s,m};}
function header(){
  document.getElementById('who').textContent=S.name?('· '+S.name):'';
  const t=total();document.getElementById('score').textContent=t.s+' / '+t.m+' pts';
  track.innerHTML='';
  MISSIONS.forEach((m,i)=>{
    const b=document.createElement('button');
    b.textContent=i===0?'Départ':i;
    b.title=m.t;b.setAttribute('aria-label','Étape '+i+' : '+m.t);
    if(S.res[i]||(i===0&&S.name))b.classList.add('done');
    if(i===S.cur)b.classList.add('here');
    const reachable=i===0||S.name&&(i<=maxReached());
    b.disabled=!reachable;
    b.onclick=()=>go(i);
    track.appendChild(b);
  });
}
function maxReached(){let m=1;for(let i=1;i<MISSIONS.length;i++){if(S.res[i])m=i+1;}return Math.min(m,MISSIONS.length-1);}
function go(i){S.cur=i;save();render();window.scrollTo({top:0});}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function shell(i,brief){
  const m=MISSIONS[i];
  const sec=el(`<section class="mission">
    <div class="mhead"><span class="mnum">${i}</span><h2>${m.t}</h2><span class="time">⏱ ${m.d} min</span></div>
    ${brief?`<div class="brief">${brief}</div>`:''}
    <div class="body"></div>
  </section>`);
  app.appendChild(sec);return sec.querySelector('.body');
}
function nextBar(body,i,getScore,onValidate){
  const bar=el(`<div class="actions"><button class="btn val">Valider mes réponses</button><span class="result"></span><button class="btn ghost nx hidden">Mission suivante</button></div>`);
  body.appendChild(bar);
  const val=bar.querySelector('.val'),nx=bar.querySelector('.nx'),r=bar.querySelector('.result');
  function showDone(){val.classList.add('hidden');nx.classList.remove('hidden');r.textContent='Score : '+S.res[i].s+' / '+S.res[i].m;}
  val.onclick=()=>{
    const res=getScore();if(res===null)return;
    S.res[i]={s:res.s,m:res.m};save();header();showDone();onValidate&&onValidate();
  };
  nx.onclick=()=>go(i+1);
  if(S.res[i]){showDone();}
  return bar;
}

/* ---------- QCM générique ---------- */
function qcm(body,qs,locked){
  const box=el('<div></div>');body.appendChild(box);
  const picks=qs.map(()=>null);
  qs.forEach((q,qi)=>{
    const w=el(`<div class="q"><div class="qt">${qi+1}. ${q.q}</div><div class="opts"></div><div class="expl"></div></div>`);
    const opts=w.querySelector('.opts');
    q.o.forEach((o,oi)=>{
      const b=el(`<button class="opt" type="button">${o}</button>`);
      b.onclick=()=>{if(w.dataset.lock)return;picks[qi]=oi;opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
      opts.appendChild(b);
    });
    w.querySelector('.expl').innerHTML=q.e;
    box.appendChild(w);
  });
  function correct(){
    if(picks.some(p=>p===null)){alert('Réponds à toutes les questions avant de valider.');return null;}
    let s=0;
    box.querySelectorAll('.q').forEach((w,qi)=>{
      w.dataset.lock=1;w.classList.add('show');
      const bs=w.querySelectorAll('.opt');
      bs[qs[qi].a].classList.add('right');
      if(picks[qi]!==qs[qi].a){bs[picks[qi]].classList.add('wrong');w.querySelector('.expl').classList.add('bad');}else s++;
    });
    return {s,m:qs.length};
  }
  function reveal(){box.querySelectorAll('.q').forEach((w,qi)=>{w.dataset.lock=1;w.classList.add('show');w.querySelectorAll('.opt')[qs[qi].a].classList.add('right');});}
  correct.ready=()=>!picks.some(p=>p===null);
  if(locked)reveal();
  return correct;
}

/* ---------- Ordre à cliquer ---------- */
function orderTask(body,items,locked,label){
  const box=el(`<div><p class="tip">${label}</p><div class="seq" aria-live="polite"><div class="seq-empty">Clique sur les étiquettes ci-dessous dans le bon ordre.</div></div><div class="pool"></div><button class="btn ghost reset" type="button">Recommencer l'ordre</button></div>`);
  body.appendChild(box);
  const seq=box.querySelector('.seq'),pool=box.querySelector('.pool');
  let chosen=[];
  function draw(){
    seq.innerHTML=chosen.length?'':'<div class="seq-empty">Clique sur les étiquettes ci-dessous dans le bon ordre.</div>';
    chosen.forEach((k,n)=>{seq.appendChild(el(`<div class="chip"><span>${n+1}</span>${esc(items[k])}</div>`));});
    pool.innerHTML='';
    order.forEach(k=>{if(chosen.includes(k))return;const b=el(`<button class="chip" type="button">${esc(items[k])}</button>`);b.onclick=()=>{if(box.dataset.lock)return;chosen.push(k);draw();};pool.appendChild(b);});
  }
  const order=shuffle(items.map((_,k)=>k));
  box.querySelector('.reset').onclick=()=>{if(box.dataset.lock)return;chosen=[];draw();};
  draw();
  function correct(){
    if(chosen.length<items.length){alert("Place toutes les étiquettes avant de valider.");return null;}
    box.dataset.lock=1;box.querySelector('.reset').classList.add('hidden');
    let s=0;const chips=seq.querySelectorAll('.chip');
    chosen.forEach((k,n)=>{if(k===n){s++;chips[n].classList.add('cellok');}else{chips[n].classList.add('cellko');chips[n].insertAdjacentHTML('beforeend',` <em>(bonne place : ${k+1})</em>`);}});
    return {s,m:items.length};
  }
  correct.ready=()=>chosen.length===items.length;
  if(locked){chosen=items.map((_,k)=>k);box.dataset.lock=1;box.querySelector('.reset').classList.add('hidden');draw();seq.querySelectorAll('.chip').forEach(c=>c.classList.add('cellok'));}
  return correct;
}

/* ================= MISSIONS ================= */
function m0(){
  const hero=el(`<div class="hero"><div class="truck" aria-hidden="true">🚚📦</div>
    <h1>Mission Réception</h1>
    <p class="lead">Mardi 6 octobre 2026, 7 h 30. Tu es équipier·ère au supermarché <b>Marché des Lilas</b> (magasin fictif). Le camion du grossiste <b>DistriFrais</b> recule à quai. Ta responsable, Mme Diallo, te confie la réception de la livraison.</p>
    <p>Ton objectif : contrôler la marchandise, repérer les problèmes, protéger le magasin en cas d'erreur, puis ranger correctement. 7 missions, environ 2 heures.</p></div>`);
  app.appendChild(hero);
  const body=shell(0,'<p>Écris ton prénom et l’initiale de ton nom. Ton score s’affichera en haut de l’écran. À la fin, tu montreras l’écran de bilan à ton professeur.</p>');
  const f=el(`<div><label for="nm"><b>Prénom + initiale</b></label><br><input id="nm" type="text" maxlength="40" autocomplete="off" value="${esc(S.name)}" style="width:min(100%,320px);margin-top:6px"><div class="actions"><button class="btn" type="button">Je prends mon poste</button></div></div>`);
  body.appendChild(f);
  f.querySelector('button').onclick=()=>{const v=f.querySelector('input').value.trim();if(!v){alert('Écris ton prénom pour commencer.');return;}S.name=v;save();go(1);};
}

function m1(){
  const body=shell(1,'<p>Avant que le livreur ouvre les portes, vérifions que tu connais le vocabulaire de base de la réception.</p>');
  const qs=[
   {q:'Qui rédige le <b>bon de commande</b> ?',o:['Le fournisseur','Le magasin (le client qui achète)','Le transporteur'],a:1,e:'Le bon de commande est rédigé par l’acheteur, ici le magasin, et envoyé au fournisseur.'},
   {q:'Quel document <b>accompagne la marchandise</b> dans le camion ?',o:['Le bon de livraison','La facture','Le ticket de caisse'],a:0,e:'Le bon de livraison (BL) arrive avec la marchandise. C’est lui que l’on contrôle et que l’on signe.'},
   {q:'La <b>facture</b> sert surtout à…',o:['Lister les produits abîmés','Demander le paiement au magasin','Indiquer où ranger les produits'],a:1,e:'La facture est le document par lequel le fournisseur demande le paiement.'},
   {q:'Compter le nombre de colis et comparer avec le BL, c’est un contrôle…',o:['Qualitatif','Quantitatif','Financier'],a:1,e:'Quantitatif = la quantité (nombre de colis, de produits).'},
   {q:'Vérifier l’état des cartons, la température et les dates, c’est un contrôle…',o:['Qualitatif','Quantitatif','Administratif'],a:0,e:'Qualitatif = la qualité et l’état de la marchandise.'},
   {q:'Une <b>réserve</b>, c’est…',o:['Une pièce où l’on stocke les produits','Une remarque écrite sur le BL pour signaler un problème à la livraison','Une réduction de prix'],a:1,e:'Attention, le mot a deux sens ! En réception, émettre une réserve = écrire sur le bon de livraison le problème constaté. (La réserve est aussi le lieu de stockage.)'}
  ];
  const c=qcm(body,qs,!!S.res[1]);nextBar(body,1,c);
}

function m2(){
  const body=shell(2,'<p>Mme Diallo pose trois documents sur le bureau. Relie chaque document à la bonne personne et au bon rôle, puis remets les étapes de la réception dans l’ordre.</p>');
  const docs=[
    {n:'Bon de commande',w:'Le magasin',r:'Demander des produits au fournisseur'},
    {n:'Bon de livraison',w:'Le fournisseur',r:'Lister ce qui est livré, à contrôler et signer'},
    {n:'Facture',w:'Le fournisseur',r:'Demander le paiement'}
  ];
  const whoOpts=['Le magasin','Le fournisseur'];
  const roleOpts=['Demander des produits au fournisseur','Lister ce qui est livré, à contrôler et signer','Demander le paiement'];
  body.appendChild(el('<h3>Partie A · Les documents</h3>'));
  const tb=el(`<div class="scroll"><table><thead><tr><th>Document</th><th>Qui l’établit ?</th><th>À quoi sert-il ?</th></tr></thead><tbody></tbody></table></div>`);
  const tbody=tb.querySelector('tbody');
  docs.forEach((d,i)=>{
    tbody.appendChild(el(`<tr><td><b>${d.n}</b></td>
      <td><select data-k="w${i}"><option value="">— choisir —</option>${whoOpts.map(o=>`<option>${o}</option>`).join('')}</select></td>
      <td><select data-k="r${i}"><option value="">— choisir —</option>${roleOpts.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`));
  });
  body.appendChild(tb);
  body.appendChild(el('<h3 style="margin-top:22px">Partie B · Les étapes dans l’ordre</h3>'));
  const steps=[
    'Accueillir le livreur et vérifier que la livraison est bien pour notre magasin',
    'Compter les colis et comparer avec le bon de livraison',
    'Vérifier l’état des colis, les dates et la température des produits frais et surgelés',
    'Écrire les réserves précises sur le bon de livraison',
    'Dater et signer le bon de livraison (le livreur signe aussi)',
    'Contrôler en détail : comparer bon de commande et bon de livraison',
    'Ranger les produits, surgelés et produits frais en premier'
  ];
  const ord=orderTask(body,steps,!!S.res[2],'Clique sur les étapes, de la première à la dernière.');

    bilan.querySelector('#rs').onclick=()=>{if(confirm('Effacer toutes tes réponses et recommencer ?')){S={name:'',cur:0,res:{},evals:{}};save();render();window.scrollTo({top:0});}};
  }
  if(S.res[7])showBilan();
}
